# Render Blueprint: https://render.com/docs/blueprint-spec
# After push: Render Dashboard → New → Blueprint → select this repo (or paste render.yaml).
# Set secret env vars in the dashboard: MONGO_URI, JWT_SECRET, GEMINI_API_KEY, etc.
services:
  - type: web
    name: news-hub-backend
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: FRONTEND_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
